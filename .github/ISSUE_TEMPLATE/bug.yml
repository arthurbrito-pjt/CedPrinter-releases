name: Relatar um problema
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: input
    id: versao
    attributes:
      label: Versão do CedPrinter
      placeholder: "ex.: 1.1.0"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Aplicativo
      options: [PC (Windows), Android]
    validations:
      required: true
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra... 2. Clique em... 3. Veja o erro"
  - type: input
    id: impressora
    attributes:
      label: Impressora (modelo e conexão)
      placeholder: "ex.: Zebra ZD230, Wi-Fi"
  - type: textarea
    id: extra
    attributes:
      label: Capturas de tela ou observações
      description: Não inclua dados reais de clientes.
