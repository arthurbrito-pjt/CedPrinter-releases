name: Sugerir uma melhoria
description: Uma ideia para o CedPrinter
labels: ["enhancement"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Que problema isso resolve?
  - type: dropdown
    id: app
    attributes:
      label: Para qual aplicativo?
      options: [PC (Windows), Android, Os dois]
